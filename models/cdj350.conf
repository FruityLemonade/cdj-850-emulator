# CDJ-350, update v1.14. Same container as the CDJ-850's C850MAIN.UPD: flat
# big-endian flash image, reset vectors at 0, 32-byte label "CDJ-350 MAIN" +
# "1.14" at flat 0x60000, BE32 packed-MAIN length at 0x60020, LZSS stream at
# 0x60024. Same MAIN platform as the CDJ-850 (SH7263 IC103, DSP56371 IC301,
# 32 MB SDRAM); the panel CPU (IC501 M3030RFCPFP) and its link differ.
# Bring-up: the cdj350 machine is the cdj850 board with the CDJ-350 panel peer.
MODEL_TITLE="CDJ-350"
MODEL_RELEASED=2010.1
MODEL_MAIN_MACHINE=cdj350
MODEL_MAIN_ARCH=sh4eb
MODEL_MAIN_BOOT=flash
MODEL_MAIN_FLASH="flash_cdj350.bin"
MODEL_GUI_MACHINE=
MODEL_EXTRACT=extract/cdj350
MODEL_FW_VERSION=1.14
MODEL_UPD="C350MAIN.UPD"
MODEL_UPD_SHA256="f3ded5970b11037a50041144a8d36bdb7f54534d001da63bdded05b71679c565"
MODEL_MAIN_SECTION=main
MODEL_KERNEL="main_flat.bin"
MODEL_MAIN_LZSS=0x60024
MODEL_UPDATE_WINDOW_END=0x3F0000
MODEL_MAIN_BASE=0x0C000000
# The c850_* steps are pinned to the CDJ-850 file; these need model-aware
# variants before prepare_firmware.sh can build the CDJ-350 images.
MODEL_FW_STEPS="c850_raw make_flash_cdj850 c850_unpack"
MODEL_LAUNCH=deck
MODEL_APP_FACE=cdj350

